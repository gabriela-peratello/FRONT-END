<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Testando Todos os Alertas do SweetAlert2</title>


    <!-- Bootstrap CSS via CDN CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">


    <!-- SweetAlert2 CSS via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.18.0/dist/sweetalert2.min.css">

    <!-- SweetAlert2 JavaScript via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.18.0/dist/sweetalert2.all.min.js" defer></script>

    <!-- Bootstrap JS via CDN JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"
        defer></script>

    <!-- Script interno para testes da API Sweet -->
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-conter nb-4">Demostração dos alertas do SweetAlert2</h1>

        <div class="row">

            <!-- Card 01 - Alerta básico -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta Básico</div>
                    <div class="card-body text-center">
                        <button id="alertBasico" class="btn btn-secondary">Exibir Alerta Básico</button>
                    </div>
                </div>
                
            </div>
            <!-- Card 02 - Alerta de sucesso -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta de Sucesso</div>
                    <div class="card-body text-center">
                        <button id="alertSucesso" class="btn btn-success">Exibir Sucesso</button>
                    </div>
                </div>

            </div>
            <!-- Card 03 - Alerta de Erro -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta de Erro</div>
                    <div class="card-body text-center">
                        <button id="alertErro" class="btn btn-danger">Exibir Erro</button>
                    </div>
                </div>

            </div>
            <!-- Card 04 - Alerta de Aviso -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta de Aviso</div>
                    <div class="card-body text-center">
                        <button id="alertAviso" class="btn btn-warning">Exibir Aviso</button>
                    </div>
                </div>

            </div>
            <!-- Card 05 - Alerta Informativo -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta Informativo</div>
                    <div class="card-body text-center">
                        <button id="alertInfo" class="btn btn-info">Exibir Alerta Informativo</button>
                    </div>
                </div>

            </div>
            <!-- Card 06 - Alerta de confirmação -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta de confirmação</div>
                    <div class="card-body text-center">
                        <button id="alertConfirm" class="btn btn-primary">Exibir Confirmação</button>
                    </div>
                </div>

            </div>
            <!-- Card 07 - Alerta com Input -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta com Input</div>
                    <div class="card-body text-center">
                        <button id="alertInput" class="btn btn-dark">Exibir Prompt</button>
                    </div>
                </div>

            </div>
            <!-- Card 08 - Alerta com Timer -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta com Timer</div>
                    <div class="card-body text-center">
                        <button id="alertTimer" class="btn btn-outline-primary">Exibir Alerta com Timer</button>
                    </div>
                </div>

            </div>
            <!-- Card 09 - Alerta com Timer e Contagem Regressiva -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta com Timer e Contagem Regressiva</div>
                    <div class="card-body text-center">
                        <button id="alertTimerCount" class="btn btn-outline-primary">Exibir Timer com Contagem Regressiva</button>
                    </div>
                </div>

            </div>
            <!-- Card 10 - Alerta com HTML Customizado -->
           <div class="col-md-4 mb-3">

                <div class="card">
                    <div class="card-header">Alerta com HTML</div>
                    <div class="card-body text-center">
                        <button id="alertHTML" class="btn btn-outline-secondary">Exibir Alerta Customizado</button>
                    </div>
                </div>

            </div>


            </div>


        </div>

    </div>

</body>

</html>
